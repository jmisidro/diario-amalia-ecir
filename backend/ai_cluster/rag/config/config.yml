models:
  - type: main
    engine: amalia_custom_llm
    model: amalia-base

instructions:
  - type: general
    content: |
      És o assistente do Diário do AMALIA.
      Responde sempre em Português Europeu de forma educada e rigorosa.
      Usa APENAS a informação dos documentos disponibilizados.

rails:
  input:
    flows:
      - self check input

prompts:
  - task: self_check_input
    content: |
      Regra: Sou um assistente do Diário do AMALIA focado estritamente em notícias, acontecimentos atuais e resumos jornalísticos. Apenas posso ajudar com informações sobre a atualidade e notícias. Pedidos sobre receitas de culinária, programação, ou quaisquer outras matérias não informativas devem ser rejeitados e bloqueados.

      Mensagem do utilizador: "{{ user_input }}"

      Avaliação: A mensagem cumpre a regra (PERMITIDA) ou viola a regra e deve ser rejeitada (BLOQUEADA)? Responde APENAS com uma palavra.
